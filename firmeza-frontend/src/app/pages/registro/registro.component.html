<div class="row justify-content-center mt-4 mb-5">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-person-plus-fill fs-1 text-warning"></i>
          <h3 class="fw-bold mt-2">Crear Cuenta</h3>
          <p class="text-muted small">Únete a Firmeza Concesionario y compra o renta en línea</p>
        </div>

        @if (mensajeError()) {
          <div class="alert alert-danger py-2 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            {{ mensajeError() }}
          </div>
        }

        <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Nombre Completo</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input
                type="text"
                class="form-control"
                name="nombreCompleto"
                [(ngModel)]="modelo.nombreCompleto"
                placeholder="Juan Pérez"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Correo Electrónico</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input
                type="email"
                class="form-control"
                name="email"
                [(ngModel)]="modelo.email"
                placeholder="juan@ejemplo.com"
                required
              />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label small fw-semibold">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input
                  type="password"
                  class="form-control"
                  name="password"
                  [(ngModel)]="modelo.password"
                  placeholder="Mínimo 6 carácteres"
                  required
                />
              </div>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label small fw-semibold">Confirmar Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                <input
                  type="password"
                  class="form-control"
                  name="confirmarPassword"
                  [(ngModel)]="confirmarPassword"
                  placeholder="Repite la contraseña"
                  required
                />
              </div>
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-warning w-100 fw-semibold mt-3"
            [disabled]="cargando()"
          >
            @if (cargando()) {
              <span class="spinner-border spinner-border-sm me-1"></span> Registrando...
            } @else {
              <i class="bi bi-check-circle me-1"></i> Registrarme
            }
          </button>
        </form>

        <div class="text-center mt-4 border-top pt-3">
          <span class="small text-muted">¿Ya tienes cuenta?</span>
          <a routerLink="/login" class="small fw-semibold text-decoration-none ms-1">
            Inicia sesión aquí
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-person-circle fs-1 text-warning"></i>
          <h3 class="fw-bold mt-2">Iniciar Sesión</h3>
          <p class="text-muted small">Ingresa tus datos para acceder a tu cuenta</p>
        </div>

        @if (mensajeError()) {
          <div class="alert alert-danger py-2 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            {{ mensajeError() }}
          </div>
        }

        <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Correo electrónico</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input
                type="email"
                class="form-control"
                name="email"
                [(ngModel)]="modelo.email"
                placeholder="ejemplo@correo.com"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                class="form-control"
                name="password"
                [(ngModel)]="modelo.password"
                placeholder="••••••••"
                required
              />
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-warning w-100 fw-semibold mt-3"
            [disabled]="cargando()"
          >
            @if (cargando()) {
              <span class="spinner-border spinner-border-sm me-1"></span> Ingresando...
            } @else {
              <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
            }
          </button>
        </form>

        <div class="text-center mt-4 border-top pt-3">
          <span class="small text-muted">¿No tienes cuenta?</span>
          <a routerLink="/registro" class="small fw-semibold text-decoration-none ms-1">
            Regístrate aquí
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
